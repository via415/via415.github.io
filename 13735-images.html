<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - 13735 Del Corso Way</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2d3748;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #edf2f7;
        }
        .btn-back {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-back:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 22px;
            color: #1a365d;
        }
        /* Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            display: none; /* Controlled by JS pagination */
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            background-color: #e2e8f0;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.04);
        }
        /* Load More Controls */
        .controls {
            text-align: center;
            margin-top: 25px;
        }
        .btn-load {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-load:hover {
            background-color: #2c5282;
        }
        /* Lightbox Preview */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 6px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Photo Gallery</h1>
        <a href="index.html" class="btn-back">&#8592; Back to Main Menu</a>
    </div>

    <div class="gallery-grid" id="gallery">
        <!-- Generates image tags dynamically for photo-1.jpg through photo-45.jpg -->
    </div>

    <div class="controls">
        <button id="loadMoreBtn" class="btn-load">Load More Photos</button>
    </div>
</div>

<!-- Fullscreen Image Preview Overlay -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="Enlarged view">
</div>

<script>
    const totalImages = 45;
    const itemsPerPage = 12;
    let currentlyShown = 0;

    const gallery = document.getElementById('gallery');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    // 1. Generate image containers dynamically
    for (let i = 1; i <= totalImages; i++) {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        // Update image path pattern below if your images are named differently (e.g. img1.jpg or photo1.jpg)
        const imgSrc = `images/photo-${i}.jpg`;
        
        item.innerHTML = `<img src="${imgSrc}" alt="Property Photo ${i}" loading="lazy" onclick="openLightbox('${imgSrc}')">`;
        gallery.appendChild(item);
    }

    const items = document.querySelectorAll('.gallery-item');

    // 2. Paginate/show images in batches
    function showNextBatch() {
        const nextLimit = currentlyShown + itemsPerPage;
        for (let i = currentlyShown; i < nextLimit && i < totalImages; i++) {
            items[i].style.display = 'block';
        }
        currentlyShown = nextLimit;

        if (currentlyShown >= totalImages) {
            loadMoreBtn.style.display = 'none'; // Hide button when all images are visible
        }
    }

    // Initial load
    showNextBatch();

    loadMoreBtn.addEventListener('click', showNextBatch);

    // 3. Fullscreen Lightbox logic
    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }
</script>

</body>
</html>
