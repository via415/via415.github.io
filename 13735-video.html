<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Walkthrough - 13735 Del Corso Way</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);

            max-width: 800px;
            border-radius: 12px;
            padding: 24px;

            display: flex;

            align-items: center;
            margin-bottom: 20px;
        }

        }

            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;

            transition: color 0.2s ease;
        }
        .btn-back:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
